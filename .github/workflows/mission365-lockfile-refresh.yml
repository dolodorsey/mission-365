name: Mission 365 Lockfile Refresh

on:
  push:
    branches: ['agent/mission365-live-admin-cohort']
    paths:
      - 'package.json'
      - '.github/workflows/mission365-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mission365-live-admin-cohort
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "refresh lockfile for nanoid security patch" || exit 0
          git push origin HEAD:agent/mission365-live-admin-cohort

name: Mission 365 Build Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Enforce Next.js security floor
        run: node scripts/verify-next-security-floor.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
      - run: npm run verify:routes

name: Mission 365 Next Security Upgrade

on:
  push:
    branches: ['agent/mission365-production-rebuild-final2']
    paths: ['.github/workflows/mission365-next-security-upgrade.yml']

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mission365-production-rebuild-final2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install next@16.3.0 --save-exact
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Commit security upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "upgrade Next.js security patch" || exit 0
          git push origin HEAD:agent/mission365-production-rebuild-final2

name: Mission 365 Security Remediation

on:
  push:
    branches:
      - agent/mission365-security-floor-gate
    paths:
      - .github/workflows/mission365-security-remediate.yml

permissions:
  contents: write

concurrency:
  group: mission365-security-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/mission365-security-floor-gate
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate dependency graph at current secure patch
        run: npm install next@16.3.4 eslint-config-next@16.3.4 --save-exact

      - name: Enforce Mission 365 security floor
        run: node scripts/verify-next-security-floor.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and contract tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Route manifest verification
        run: npm run verify:routes

      - name: Commit verified dependency graph and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/mission365-security-remediate.yml
          git add package.json package-lock.json .github/workflows/mission365-security-remediate.yml
          if git diff --cached --quiet; then
            echo "No dependency changes produced; refusing to fabricate remediation."
            exit 1
          fi
          git commit -m "Upgrade Mission 365 Next.js security floor to 16.3.4"
          git push origin HEAD:agent/mission365-security-floor-gate
